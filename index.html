                        ent.hd = document.getElementById("modalHd")?.value?.trim() || "2";
                        ent.morale = parseInt(document.getElementById("modalMorale")?.value || "12", 10);
                    }
                    targetEnt = ent;
                }
            } else {
                const newEnt = {
                    id: "ent_" + Date.now(), tokenId,
                    name, type, hp, maxHp, thac0, ac, weaponDice, toHitMod, dmgMod, weaponSpeed,
                    initRoll: 5, initiative: 5 + weaponSpeed, defeated: hp === 0, statuses: selectedStatuses
                };
                if (type !== 'enemy') {
                    newEnt.class1 = document.getElementById("modalClass1")?.value || "Fighter";
                    newEnt.class2 = document.getElementById("modalClass2")?.value || "";
                    newEnt.lvl1 = parseInt(document.getElementById("modalLvl1")?.value || "1", 10);
                    newEnt.lvl2 = newEnt.class2 ? (parseInt(document.getElementById("modalLvl2")?.value || "1", 10)) : 1;
                    newEnt.xp1 = parseInt(document.getElementById("modalXp1")?.value || "0", 10);
                    newEnt.xp2 = newEnt.class2 ? (parseInt(document.getElementById("modalXp2")?.value || "0", 10)) : 0;
                    newEnt.str = parseInt(document.getElementById("modalStr")?.value || "10", 10);
                    newEnt.exceptionalStr = document.getElementById("modalExceptionalStr")?.value || "01";
                    newEnt.dex = parseInt(document.getElementById("modalDex")?.value || "10", 10);
                    newEnt.con = parseInt(document.getElementById("modalCon")?.value || "10", 10);
                    newEnt.int = parseInt(document.getElementById("modalInt")?.value || "10", 10);
                    newEnt.wis = parseInt(document.getElementById("modalWis")?.value || "10", 10);
                    newEnt.cha = parseInt(document.getElementById("modalCha")?.value || "10", 10);
                    newEnt.saves = readSaves();
                } else {
                    newEnt.monsterXp = parseInt(document.getElementById("modalMonsterXp")?.value || "50", 10);
                    newEnt.hd = document.getElementById("modalHd")?.value?.trim() || "2";
                    newEnt.morale = parseInt(document.getElementById("modalMorale")?.value || "12", 10);
                }
                entities.push(newEnt);
                targetEnt = newEnt;
            }
            closeAddModal();
            if (targetEnt && targetEnt.tokenId) syncTokenOnMap(targetEnt);
            syncState();
            renderRoster();
        }

        function deleteCurrentEntity() {
            if (!gmMode) return;
            const editIdEl = document.getElementById("editEntityId");
            if (!editIdEl) return;
            const id = editIdEl.value;
            const index = entities.findIndex(e => e.id === id);
            if (index !== -1) {
                logAction(`🗑️ Removed <b>${entities[index].name}</b>.`);
                entities.splice(index, 1);
                if (activeTurnIndex >= entities.length) activeTurnIndex = 0;
            }
            closeAddModal();
            syncState();
            renderRoster();
        }

        function exportRosterJson() {
            const blob = new Blob([JSON.stringify({ entities, combatXpPool, currentRound }, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "add2e-grimoire-backup.json";
            a.click();
        }

        function importRosterJson(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.entities) {
                        entities = data.entities;
                        combatXpPool = data.combatXpPool || 0;
                        currentRound = data.currentRound || 1;
                        syncState();
                        renderRoster();
                        logAction("📂 Roster backup imported successfully!");
                    }
                } catch (err) {
                    alert("Invalid JSON file.");
                }
            };
            reader.readAsText(file);
        }

        loadLocalState();
        renderRoster();

        (async function initObr() {
            try {
                const mod = await import("https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm");
                OBR_SDK = mod.default;
                if (OBR_SDK && OBR_SDK.isAvailable) {
                    OBR_SDK.onReady(async () => {
                        isObrConnected = true;
                        const dot = document.getElementById("obrStatusDot");
                        const txt = document.getElementById("obrStatusText");
                        if (dot) dot.classList.add("connected");
                        if (txt) txt.innerText = "OBR Room Connected";

                        const role = await OBR_SDK.player.getRole();
                        setGmPermission(role === "GM");
                        OBR_SDK.player.onChange((player) => setGmPermission(player.role === "GM"));

                        const meta = await OBR_SDK.room.getMetadata();
                        if (meta[META_KEY]) {
                            entities = meta[META_KEY].entities || entities;
                            combatXpPool = meta[META_KEY].combatXpPool || 0;
                            currentRound = meta[META_KEY].currentRound || 1;
                            activeTurnIndex = meta[META_KEY].activeTurnIndex || 0;
                            renderRoster();
                        } else {
                            await syncState();
                        }

                        OBR_SDK.room.onMetadataChange((newMeta) => {
                            if (newMeta[META_KEY]) {
                                entities = newMeta[META_KEY].entities || entities;
                                combatXpPool = newMeta[META_KEY].combatXpPool || 0;
                                currentRound = newMeta[META_KEY].currentRound || 1;
                                activeTurnIndex = newMeta[META_KEY].activeTurnIndex || 0;
                                renderRoster();
                            }
                        });

                        OBR_SDK.contextMenu.create({
                            id: "com.add2e.grimoire/context-add",
                            icons: [{
                                icon: "https://www.owlbear.rodeo/favicon.ico",
                                label: "Add / Link to 2e Grimoire",
                                filter: { every: [{ key: "layer", value: "CHARACTER" }] }
                            }],
                            onClick(context) {
                                const item = context.items[0];
                                if (!item) return;
                                const rawName = (item.text && item.text.plainText) || item.name || "Map Token";
                                const cleanName = rawName.split("\n")[0].replace(/\s*\(\d+\/\d+\)$/, "").replace(/^💀\s*/, "");
                                openAddModal('enemy', cleanName, item.id);
                            }
                        });
                    });
                }
            } catch (err) {}
        })();
    </script>
</body>
</html>
