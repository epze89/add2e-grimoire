<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD&D 2e GM Grimoire</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121417;
            color: #e2e8f0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1a1d24; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }

        /* Layout & Containers */
        header { border-bottom: 1px solid #1f2937; padding-bottom: 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
        .row-between { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .row-center { display: flex; align-items: center; gap: 6px; }
        .bar-box { background: #111827; border: 1px solid #1f2937; border-radius: 6px; padding: 6px 8px; }
        .xp-banner { background: rgba(17, 24, 39, 0.9); border: 1px solid rgba(120, 53, 15, 0.5); border-radius: 6px; padding: 8px; }
        main { flex: 1; overflow-y: auto; max-height: 420px; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
        
        /* Typography & Colors */
        .title-amber { font-weight: 700; font-size: 14px; color: #f59e0b; letter-spacing: 0.03em; }
        .badge-round { background: #1e1b4b; border: 1px solid #4338ca; color: #a5b4fc; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-family: monospace; cursor: pointer; }
        .badge-round:hover { border-color: #818cf8; color: #fff; }
        .text-amber { color: #fbbf24; font-weight: 700; }
        .text-blue { color: #60a5fa; font-weight: 700; }
        .text-emerald { color: #34d399; font-weight: 700; }
        .text-red { color: #f87171; font-weight: 700; }
        .text-muted { color: #9ca3af; font-size: 10px; }

        /* Buttons & Inputs */
        button { cursor: pointer; border: none; border-radius: 4px; font-size: 11px; font-weight: 600; padding: 4px 8px; color: #fff; transition: opacity 0.15s, transform 0.1s; }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-amber { background: #d97706; }
        .btn-blue { background: #1e40af; color: #bfdbfe; }
        .btn-red { background: #991b1b; color: #fecaca; }
        .btn-indigo { background: #4338ca; }
        .btn-indigo-dark { background: #312e81; border: 1px solid #4f46e5; color: #c7d2fe; }
        .btn-emerald { background: #059669; color: #ecfdf5; font-size: 10px; padding: 2px 6px; box-shadow: 0 0 8px rgba(16, 185, 129, 0.35); }
        .btn-emerald-outline { background: rgba(6, 78, 59, 0.6); border: 1px solid rgba(16, 185, 129, 0.5); color: #a7f3d0; font-size: 10px; }
        .btn-gm-on { background: rgba(120, 53, 15, 0.6); border: 1px solid rgba(217, 119, 6, 0.5); color: #fde68a; font-size: 10px; }
        .btn-gm-off { background: #1f2937; border: 1px solid #374151; color: #9ca3af; font-size: 10px; }
        .btn-icon { padding: 4px 6px; font-size: 11px; }
        .btn-ghost { background: transparent; color: #9ca3af; padding: 2px 4px; }
        .status-badge { background: #1e1b4b; border: 1px solid #4338ca; color: #c7d2fe; font-size: 9px; padding: 1px 4px; border-radius: 3px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }

        input, select {
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 4px;
            padding: 3px 5px;
            font-size: 11px;
        }
        .input-mini { width: 44px; text-align: center; font-weight: 700; font-size: 10px; padding: 2px; background: #111827; }
        .input-spd { width: 32px; text-align: center; font-weight: 700; font-size: 10px; padding: 2px; color: #fcd34d; background: #111827; }

        /* Tactical Card */
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; transition: opacity 0.2s; position: relative; }
        .card-turn { border-color: #f59e0b; box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.4); }
        .card-enemy { border-color: rgba(127, 29, 29, 0.5); }
        .card-dead { opacity: 0.6; }

        .tactical-grid { display: grid; grid-template-columns: 55px 1fr 55px; gap: 6px; align-items: center; }
        .tac-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3px 2px; border-radius: 4px; font-weight: 800; font-size: 13px; text-align: center; line-height: 1.1; }
        .badge-thac0 { background: #0f172a; border: 2px solid #38bdf8; color: #38bdf8; }
        .badge-ac { background: #0f172a; border: 2px solid #94a3b8; color: #f8fafc; }
        .badge-spd { background: #0f172a; border: 2px solid #facc15; color: #facc15; }
        .badge-init { background: #0f172a; border: 2px solid #4ade80; color: #4ade80; }
        .tac-label { font-size: 7px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; font-weight: 600; margin-bottom: 1px; }

        .hero-hp-bar { width: 100%; background: #991b1b; border: 1px solid #dc2626; border-radius: 4px; padding: 4px 8px; display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 800; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .hero-hp-bar input { background: transparent; border: none; color: #fff; font-weight: 800; font-size: 13px; width: 65px; text-align: right; }

        /* Expandable Drawer Grids */
        .drawer { border-top: 1px solid #1f2937; padding-top: 6px; display: flex; flex-direction: column; gap: 6px; }
        .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; background: #090a0f; padding: 4px; border-radius: 4px; text-align: center; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #090a0f; padding: 4px; border-radius: 4px; text-align: center; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .roll-box { background: #111827; border: 1px solid #1f2937; padding: 3px 2px; border-radius: 4px; }
        .roll-box:hover { background: #1f2937; border-color: #4b5563; }

        /* Action Log & Footer */
        #actionLog { margin-top: 8px; background: #090a0f; border: 1px solid #1f2937; border-radius: 6px; padding: 8px 10px; text-align: center; color: #d1d5db; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        #actionLogText { display: inline-block; line-height: 1.4; word-spacing: normal; }
        footer { margin-top: 8px; padding-top: 8px; border-top: 1px solid #1f2937; font-size: 10px; color: #9ca3af; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #f59e0b; }
        .status-dot.connected { background: #10b981; }

        /* Modal */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 10px; overflow-y: auto; }
        .modal-box { background: #111827; border: 1px solid #374151; width: 100%; max-width: 390px; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 95vh; overflow-y: auto; }
        .modal-box input, .modal-box select { width: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- TOP HEADER & CONTROLS -->
    <header>
        <div class="row-between">
            <div class="row-center">
                <span class="title-amber">⚔️ AD&D 2E GRIMOIRE</span>
                <span id="roundBadge" onclick="resetRounds()" class="badge-round" title="Click to reset combat round to Rd 1">Rd 1</span>
            </div>
            <div class="row-center">
                <button onclick="linkSelectedMapToken()" class="btn-emerald-outline" title="Create a new entity from the selected Owlbear Rodeo token">🔗 + From Token</button>
                <button onclick="toggleGmMode()" id="gmModeBtn" class="btn-gm-on">🔒 <span id="gmModeText">GM Mode: ON</span></button>
            </div>
        </div>

        <!-- ADD ENTITY & INITIATIVE BAR -->
        <div class="bar-box row-between">
            <div class="row-center">
                <button onclick="openAddModal('pc')" class="btn-amber">+ PC</button>
                <button onclick="openAddModal('npc')" class="btn-blue">+ NPC</button>
                <button onclick="openAddModal('enemy')" class="btn-red">+ Enemy</button>
            </div>
            <div class="row-center">
                <button onclick="rollAllInitiative()" class="btn-indigo" title="Roll 1d10 + Speed Factor (Lowest acts first)">🎲 Init</button>
                <button onclick="nextTurn()" class="btn-indigo-dark" title="Advance to next living combatant">⏭️ Next</button>
                <select id="groupFilter" onchange="renderRoster()" style="color:#fbbf24; font-weight:700;">
                    <option value="all">All</option>
                    <option value="pc">PCs</option>
                    <option value="npc">NPCs</option>
                    <option value="enemy">Enemies</option>
                </select>
            </div>
        </div>

        <!-- COMBAT XP POOL BANNER -->
        <div class="xp-banner row-between">
            <div class="row-center">
                <span class="text-muted" style="font-size:11px;">Combat XP Pool:</span>
                <span id="xpPoolDisplay" class="text-amber" style="font-size:13px;">0 XP</span>
                <button id="clearXpBtn" onclick="clearXpPool()" class="btn-ghost hidden" title="Clear XP Pool" style="font-size:10px;">✕</button>
            </div>
            <button id="distributeXpBtn" onclick="distributeXpPool()" class="btn-amber">✨ Distribute to Party</button>
        </div>
    </header>

    <!-- ROSTER CONTAINER -->
    <main id="rosterContainer"></main>

    <!-- LIVE LOG / RESULT BANNER -->
    <div id="actionLog">
        <span id="actionLogText">Select a token or click any stat, save, or weapon button to roll...</span>
    </div>

    <!-- FOOTER: OBR STATUS & BACKUP -->
    <footer class="row-between">
        <div class="row-center">
            <span id="obrStatusDot" class="status-dot"></span>
            <span id="obrStatusText">Browser Mode (Local Save)</span>
        </div>
        <div class="row-center">
            <button onclick="syncAllTokensToMap()" class="btn-ghost" title="Push all linked HP & stats badges to Owlbear Rodeo tokens" style="text-decoration:underline;">Sync Map Badges</button>
            <button onclick="exportRosterJson()" class="btn-ghost" style="text-decoration:underline;">Export JSON</button>
            <label style="cursor:pointer; text-decoration:underline; color:#9ca3af;">
                Import JSON
                <input type="file" accept=".json" onchange="importRosterJson(event)" class="hidden">
            </label>
        </div>
    </footer>

    <!-- ADD/EDIT ENTITY MODAL -->
    <div id="entityModal" class="modal-backdrop hidden">
        <div class="modal-box">
            <div class="row-between">
                <h2 id="modalTitle" class="title-amber">Add Entity</h2>
                <button type="button" id="autoCalcBtn" onclick="autoCalcAll2eStats(true)" class="btn-amber" style="font-size:10px; padding:3px 7px;" title="Recalculate HP, THAC0, and Saving Throws from Class & Level">⚡ Auto-Calc 2e</button>
            </div>
            <input type="hidden" id="editEntityId">
            <input type="hidden" id="modalTokenId">

            <div class="grid-2">
                <div>
                    <label class="text-muted">Name</label>
                    <input type="text" id="modalName">
                </div>
                <div>
                    <label class="text-muted">Group Category</label>
                    <select id="modalType" onchange="toggleEntityFields()">
                        <option value="pc">Player Character (PC)</option>
                        <option value="npc">Non-Player Character (NPC)</option>
                        <option value="enemy">Enemy / Monster</option>
                    </select>
                </div>
            </div>

            <div class="grid-3">
                <div>
                    <label class="text-muted">HP (Cur / Max)</label>
                    <div class="row-center">
                        <input type="number" id="modalHp" value="15" style="text-align:center;">
                        <input type="number" id="modalMaxHp" value="15" style="text-align:center;">
                    </div>
                </div>
                <div>
                    <label class="text-muted" id="thac0Label">THAC0 (Auto)</label>
                    <input type="number" id="modalThac0" value="20" style="text-align:center; color:#fbbf24; font-weight:700;">
                </div>
                <div>
                    <label class="text-muted">Armor Class (AC)</label>
                    <input type="number" id="modalAc" value="10" style="text-align:center;">
                </div>
            </div>

            <!-- WEAPON STATS, SPEED FACTOR & TO-HIT MOD -->
            <div class="grid-3 bar-box">
                <div>
                    <label class="text-muted">Weapon Dice</label>
                    <input type="text" id="modalWeaponDice" value="1d8" style="text-align:center;">
                </div>
                <div>
                    <label class="text-muted" title="Magic weapon, spec, or Str to-hit bonus">+Hit Mod</label>
                    <input type="number" id="modalToHit" value="0" style="text-align:center;">
                </div>
                <div>
                    <label class="text-amber" style="font-size:10px;">Speed / Cast</label>
                    <input type="number" id="modalWeaponSpeed" value="5" style="text-align:center; color:#fbbf24; font-weight:700;">
                </div>
            </div>

            <!-- ENEMY / MONSTER SPECIFIC FIELDS (Hit Dice & Morale) -->
            <div id="enemyFields" class="hidden" style="border-top:1px solid #1f2937; padding-top:8px;">
                <div class="grid-3">
                    <div>
                        <label class="text-muted">Hit Dice (HD)</label>
                        <input type="text" id="modalHd" value="3+1" onchange="autoCalcMonsterThac0()" style="text-align:center;" title="e.g. 3+1 (Auto-sets THAC0 = 20 - HD)">
                    </div>
                    <div>
                        <label class="text-muted">Morale (2d10)</label>
                        <input type="number" id="modalMorale" value="12" style="text-align:center;">
                    </div>
                    <div>
                        <label class="text-muted">XP Reward</label>
                        <input type="number" id="modalMonsterXp" value="65" style="text-align:center;">
                    </div>
                </div>
            </div>

            <!-- PC / NPC SPECIFIC FIELDS -->
            <div id="characterFields" style="display:flex; flex-direction:column; gap:8px; border-top:1px solid #1f2937; padding-top:8px;">
                <div class="grid-2">
                    <div>
                        <label class="text-muted">Primary Class</label>
                        <select id="modalClass1" onchange="onClassSelectionChange()">
                            <option value="Fighter">Fighter (Warrior)</option>
                            <option value="Paladin">Paladin (Warrior)</option>
                            <option value="Ranger">Ranger (Warrior)</option>
                            <option value="Priest">Priest / Cleric</option>
                            <option value="Druid">Druid (Priest)</option>
                            <option value="Thief">Thief (Rogue)</option>
                            <option value="Bard">Bard (Rogue)</option>
                            <option value="Wizard">Wizard / Mage</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-muted">Secondary Class (Multi)</label>
                        <select id="modalClass2" onchange="onClassSelectionChange()">
                            <option value="">(None / Single-class)</option>
                            <option value="Fighter">Fighter (Warrior)</option>
                            <option value="Ranger">Ranger (Warrior)</option>
                            <option value="Priest">Priest / Cleric</option>
                            <option value="Druid">Druid (Priest)</option>
                            <option value="Thief">Thief (Rogue)</option>
                            <option value="Wizard">Wizard / Mage</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label id="lblLvl1" class="text-muted">Level</label>
                        <input type="number" id="modalLvl1" min="1" max="20" onchange="autoCalcAll2eStats(false)" value="1" style="text-align:center;">
                    </div>
                    <div>
                        <label id="lblXp1" class="text-muted">Experience (XP)</label>
                        <input type="number" id="modalXp1" value="0" style="text-align:center;">
                    </div>
                </div>

                <div id="multiClassRow" class="grid-2 hidden">
                    <div>
                        <label id="lblLvl2" class="text-muted">Class 2 Level</label>
                        <input type="number" id="modalLvl2" min="1" max="20" onchange="autoCalcAll2eStats(false)" value="1" style="text-align:center;">
                    </div>
                    <div>
                        <label id="lblXp2" class="text-muted">Class 2 XP</label>
                        <input type="number" id="modalXp2" value="0" style="text-align:center;">
                    </div>
                </div>

                <!-- 6 ABILITY SCORES & EXCEPTIONAL STRENGTH -->
                <div>
                    <div class="row-between" style="margin-bottom:3px;">
                        <label class="text-amber" style="font-size:10px;">AD&D 2e Ability Scores</label>
                        <div id="excStrContainer" class="row-center hidden">
                            <span class="text-muted" style="font-size:9px;">Exceptional STR:</span>
                            <select id="modalExceptionalStr" style="width:75px; font-size:10px; padding:1px;">
                                <option value="01">01–50</option>
                                <option value="51">51–75</option>
                                <option value="76">76–90</option>
                                <option value="91">91–99</option>
                                <option value="00">00</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid-6">
                        <div><span class="stat-label">STR</span><input type="number" id="modalStr" value="15" onchange="checkExceptionalStrengthVisibility()" style="text-align:center;"></div>
                        <div><span class="stat-label">DEX</span><input type="number" id="modalDex" value="14" style="text-align:center;"></div>
                        <div><span class="stat-label">CON</span><input type="number" id="modalCon" onchange="autoCalcAll2eStats(true)" value="14" style="text-align:center;"></div>
                        <div><span class="stat-label">INT</span><input type="number" id="modalInt" value="12" style="text-align:center;"></div>
                        <div><span class="stat-label">WIS</span><input type="number" id="modalWis" value="12" style="text-align:center;" title="18+ Wisdom grants +10% earned XP"></div>
                        <div><span class="stat-label">CHA</span><input type="number" id="modalCha" value="10" style="text-align:center;"></div>
                    </div>
                </div>

                <!-- STATUS / CONDITIONS SELECTOR -->
                <div>
                    <label class="text-muted" style="font-size:10px; display:block; margin-bottom:3px;">Active Combat Status Tags</label>
                    <div class="row-center" style="gap:4px; flex-wrap:wrap;">
                        <label class="status-badge"><input type="checkbox" value="Casting ⚡" class="status-chk"> Casting ⚡</label>
                        <label class="status-badge"><input type="checkbox" value="Blessed ✨" class="status-chk"> Blessed ✨</label>
                        <label class="status-badge"><input type="checkbox" value="Hasted 💨" class="status-chk"> Hasted 💨</label>
                        <label class="status-badge"><input type="checkbox" value="Paralyzed 🌀" class="status-chk"> Paralyzed 🌀</label>
                        <label class="status-badge"><input type="checkbox" value="Blinded 👁️" class="status-chk"> Blinded 👁️</label>
                        <label class="status-badge"><input type="checkbox" value="Prone ⬇️" class="status-chk"> Prone ⬇️</label>
                    </div>
                </div>

                <!-- 5 SAVING THROWS -->
                <div>
                    <label class="text-emerald" style="font-size:10px; display:block; margin-bottom:3px;">AD&D 2e Saving Throws</label>
                    <div class="grid-5">
                        <div><span class="stat-label">PPD</span><input type="number" id="modalSavePPD" value="14" style="text-align:center; color:#34d399; font-weight:700;"></div>
                        <div><span class="stat-label">RSW</span><input type="number" id="modalSaveRSW" value="16" style="text-align:center; color:#34d399; font-weight:700;"></div>
                        <div><span class="stat-label">PP</span><input type="number" id="modalSavePP" value="15" style="text-align:center; color:#34d399; font-weight:700;"></div>
                        <div><span class="stat-label">BW</span><input type="number" id="modalSaveBW" value="17" style="text-align:center; color:#34d399; font-weight:700;"></div>
                        <div><span class="stat-label">SPL</span><input type="number" id="modalSaveSPL" value="17" style="text-align:center; color:#34d399; font-weight:700;"></div>
                    </div>
                </div>
            </div>

            <div class="row-between" style="border-top:1px solid #1f2937; padding-top:8px;">
                <button id="modalDeleteBtn" onclick="deleteCurrentEntity()" class="btn-red hidden">🗑️ Delete</button>
                <div class="row-center" style="margin-left:auto;">
                    <button onclick="closeAddModal()" style="background:#374151;">Cancel</button>
                    <button onclick="saveEntity()" class="btn-amber">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script>
        const META_KEY = "com.add2e.grimoire/state";
        const STORAGE_KEY = "add2e_grimoire_state_v10";

        const defaultEntities = [
            {
                id: "pc_1",
                name: "Thorin Ironhand",
                type: "pc",
                hp: 16, maxHp: 16, thac0: 19, ac: 3,
                weaponDice: "1d8", dmgMod: 1, toHitMod: 1, weaponSpeed: 5, initiative: 8, initRoll: 3,
                class1: "Fighter", class2: "Thief",
                lvl1: 2, lvl2: 2, xp1: 2100, xp2: 2500,
                str: 18, exceptionalStr: "51", dex: 14, con: 17, int: 10, wis: 13, cha: 9,
                statuses: ["Blessed ✨"],
                saves: { ppd: 13, rsw: 14, pp: 12, bw: 16, spl: 15 }
            },
            {
                id: "npc_1",
                name: "Sister Althea",
                type: "npc",
                hp: 7, maxHp: 7, thac0: 20, ac: 5,
                weaponDice: "1d6", dmgMod: 0, toHitMod: 0, weaponSpeed: 4, initiative: 9, initRoll: 5,
                class1: "Priest", class2: "", lvl1: 1, lvl2: 1, xp1: 0, xp2: 0,
                str: 12, dex: 10, con: 14, int: 12, wis: 18, cha: 13,
                statuses: [],
                saves: { ppd: 10, rsw: 14, pp: 13, bw: 16, spl: 15 }
            },
            {
                id: "mon_1",
                name: "Goblin Chieftain",
                type: "enemy",
                hp: 14, maxHp: 16, thac0: 17, ac: 5,
                weaponDice: "1d6", dmgMod: 1, toHitMod: 0, weaponSpeed: 6, initiative: 10, initRoll: 4,
                hd: "3+1", morale: 12, monsterXp: 120, defeated: false,
                statuses: []
            }
        ];

        let entities = [];
        let combatXpPool = 0;
        let currentRound = 1;
        let activeTurnIndex = 0;
        let expandedRows = {};
        let gmMode = true;
        let OBR_SDK = null;
        let isObrConnected = false;

        function setVal(id, val) {
            const el = document.getElementById(id);
            if (el) el.value = val !== undefined && val !== null ? val : "";
        }

        const XP_TABLES = {
            Fighter: [0, 2000, 4000, 8000, 16000, 32000, 64000, 125000, 250000, 500000],
            Paladin: [0, 2250, 4500, 9000, 18000, 36000, 75000, 150000, 300000, 600000],
            Ranger:  [0, 2250, 4500, 9000, 18000, 36000, 75000, 150000, 300000, 600000],
            Priest:  [0, 1500, 3000, 6000, 13000, 27500, 55000, 110000, 225000, 450000],
            Druid:   [0, 2000, 4000, 7500, 12500, 20000, 35000, 60000, 90000, 125000],
            Thief:   [0, 1250, 2500, 5000, 10000, 20000, 40000, 70000, 110000, 160000],
            Bard:    [0, 1250, 2500, 5000, 10000, 20000, 40000, 70000, 110000, 160000],
            Wizard:  [0, 2500, 5000, 10000, 20000, 40000, 60000, 90000, 135000, 250000]
        };

        function getNextLevelXp(className, currentLevel) {
            const table = XP_TABLES[className] || XP_TABLES.Fighter;
            const lvl = Math.max(1, parseInt(currentLevel, 10) || 1);
            if (lvl < table.length) return table[lvl];
            return table[table.length - 1] + (lvl - table.length + 1) * 250000;
        }

        function get2eArchetype(className) {
            if (["Fighter", "Paladin", "Ranger"].includes(className)) return "warrior";
            if (["Priest", "Druid"].includes(className)) return "priest";
            if (["Thief", "Bard"].includes(className)) return "rogue";
            return "wizard";
        }

        function getConHpBonus(con, isWarrior) {
            const c = parseInt(con, 10) || 10;
            if (c >= 19) return isWarrior ? 5 : 2;
            if (c === 18) return isWarrior ? 4 : 2;
            if (c === 17) return isWarrior ? 3 : 2;
            if (c === 16) return 2;
            if (c === 15) return 1;
            if (c <= 3) return -2;
            if (c <= 6) return -1;
            return 0;
        }

        function calcClassThac0(className, level) {
            const lvl = Math.max(1, Math.min(20, parseInt(level, 10) || 1));
            const group = get2eArchetype(className);
            if (group === "warrior") return Math.max(1, 21 - lvl);
            if (group === "priest") return Math.max(1, 20 - Math.floor((lvl - 1) / 3) * 2);
            if (group === "rogue") return Math.max(1, 20 - Math.floor((lvl - 1) / 2));
            return Math.max(1, 20 - Math.floor((lvl - 1) / 3));
        }

        function calcClassSaves(className, level) {
            const lvl = Math.max(1, parseInt(level, 10) || 1);
            const group = get2eArchetype(className);
            let row = [14, 16, 15, 17, 17];

            if (group === "warrior") {
                if (lvl <= 2) row = [14, 16, 15, 17, 17];
                else if (lvl <= 4) row = [13, 15, 14, 16, 16];
                else if (lvl <= 6) row = [11, 13, 12, 13, 14];
                else if (lvl <= 8) row = [10, 12, 11, 12, 13];
                else if (lvl <= 10) row = [8, 10, 9, 9, 11];
                else if (lvl <= 12) row = [7, 9, 8, 8, 10];
                else if (lvl <= 14) row = [5, 7, 6, 5, 8];
                else if (lvl <= 16) row = [4, 6, 5, 4, 7];
                else row = [3, 5, 4, 4, 6];
            } else if (group === "priest") {
                if (lvl <= 3) row = [10, 14, 13, 16, 15];
                else if (lvl <= 6) row = [9, 13, 12, 15, 14];
                else if (lvl <= 9) row = [7, 11, 10, 13, 12];
                else if (lvl <= 12) row = [6, 10, 9, 12, 11];
                else if (lvl <= 15) row = [5, 9, 8, 11, 10];
                else if (lvl <= 18) row = [4, 8, 7, 10, 9];
                else row = [2, 6, 5, 8, 7];
            } else if (group === "rogue") {
                if (lvl <= 4) row = [13, 14, 12, 16, 15];
                else if (lvl <= 8) row = [12, 12, 11, 15, 13];
                else if (lvl <= 12) row = [11, 10, 10, 14, 11];
                else if (lvl <= 16) row = [10, 8, 9, 13, 9];
                else row = [9, 6, 8, 12, 7];
            } else {
                if (lvl <= 5) row = [14, 11, 13, 15, 12];
                else if (lvl <= 10) row = [13, 9, 11, 13, 10];
                else if (lvl <= 15) row = [11, 7, 9, 11, 8];
                else row = [10, 5, 7, 9, 6];
            }
            return { ppd: row[0], rsw: row[1], pp: row[2], bw: row[3], spl: row[4] };
        }

        function calcBestEntityThac0(ent) {
            let best = calcClassThac0(ent.class1, ent.lvl1);
            if (ent.class2) {
                best = Math.min(best, calcClassThac0(ent.class2, ent.lvl2 || 1));
            }
            return best;
        }

        function calcBestEntitySaves(ent) {
            const s1 = calcClassSaves(ent.class1, ent.lvl1);
            if (!ent.class2) return s1;
            const s2 = calcClassSaves(ent.class2, ent.lvl2 || 1);
            return {
                ppd: Math.min(s1.ppd, s2.ppd),
                rsw: Math.min(s1.rsw, s2.rsw),
                pp: Math.min(s1.pp, s2.pp),
                bw: Math.min(s1.bw, s2.bw),
                spl: Math.min(s1.spl, s2.spl)
            };
        }

        function checkExceptionalStrengthVisibility() {
            const strInput = document.getElementById("modalStr");
            const classInput = document.getElementById("modalClass1");
            const container = document.getElementById("excStrContainer");
            if (!strInput || !classInput || !container) return;

            const strVal = parseInt(strInput.value, 10) || 10;
            const isWarrior = ["Fighter", "Paladin", "Ranger"].includes(classInput.value);
            if (strVal === 18 && isWarrior) {
                container.classList.remove("hidden");
            } else {
                container.classList.add("hidden");
            }
        }

        function autoCalcMonsterThac0() {
            const hdInput = document.getElementById("modalHd");
            const thac0Input = document.getElementById("modalThac0");
            if (!hdInput || !thac0Input) return;

            const baseHd = parseInt(hdInput.value.trim(), 10) || 1;
            const autoThac0 = Math.max(1, 20 - baseHd);
            thac0Input.value = autoThac0;
        }

        function rollMorale(id) {
            const ent = entities.find(e => e.id === id);
            if (!ent) return;
            const target = ent.morale || 12;
            const r1 = Math.floor(Math.random() * 10) + 1;
            const r2 = Math.floor(Math.random() * 10) + 1;
            const sum = r1 + r2;
            const passed = sum <= target;
            const badge = passed ? `<span class="text-emerald">HOLDS GROUND!</span>` : `<span class="text-red">BREAKS & FLEES!</span>`;
            logAction(`🎲 <b>${ent.name}</b> Morale Check (2d10): rolled <b>${sum}</b> (${r1}+${r2}, Target &le; ${target}) &rarr; ${badge}`);
        }

        function levelUpClass(id, classIndex) {
            const ent = entities.find(e => e.id === id);
            if (!ent || ent.type === "enemy") return;

            const isSecond = classIndex === 2;
            const targetClass = isSecond ? ent.class2 : ent.class1;
            if (!targetClass) return;

            const oldLvl = (isSecond ? ent.lvl2 : ent.lvl1) || 1;
            const newLvl = oldLvl + 1;
            if (isSecond) ent.lvl2 = newLvl;
            else ent.lvl1 = newLvl;

            const group = get2eArchetype(targetClass);
            const hasWarrior = get2eArchetype(ent.class1) === "warrior" || (ent.class2 && get2eArchetype(ent.class2) === "warrior");
            const conBonus = getConHpBonus(ent.con, hasWarrior);

            let hdSides = 4;
            let nameLevelCap = 10;
            let postCapFlatHp = 1;

            if (group === "warrior") { hdSides = 10; nameLevelCap = 9; postCapFlatHp = 3; }
            else if (group === "priest") { hdSides = 8; nameLevelCap = 9; postCapFlatHp = 2; }
            else if (group === "rogue") { hdSides = 6; nameLevelCap = 10; postCapFlatHp = 2; }

            let rawHpGain = 1;
            let rollBreakdown = "";

            if (newLvl <= nameLevelCap) {
                const dieRoll = Math.floor(Math.random() * hdSides) + 1;
                rawHpGain = Math.max(1, dieRoll + conBonus);
                const signCon = conBonus >= 0 ? `+${conBonus}` : `${conBonus}`;
                rollBreakdown = `1d${hdSides} (${dieRoll}) ${signCon} CON`;
            } else {
                rawHpGain = postCapFlatHp;
                rollBreakdown = `fixed +${postCapFlatHp} post-name-level`;
            }

            let finalHpGain = rawHpGain;
            if (ent.class2) {
                finalHpGain = Math.max(1, Math.floor(rawHpGain / 2));
                rollBreakdown += ` &divide; 2 multi-class`;
            }

            ent.maxHp += finalHpGain;
            ent.hp += finalHpGain;
            ent.thac0 = calcBestEntityThac0(ent);
            ent.saves = calcBestEntitySaves(ent);

            logAction(`🎉 <b>${ent.name}</b> reached <b>${targetClass} Level ${newLvl}</b>! Gained <b class="text-emerald">+${finalHpGain} HP</b> (${rollBreakdown}) &rarr; THAC0 <b>${ent.thac0}</b>!`);
            syncTokenOnMap(ent);
            syncState();
            renderRoster();
        }

        // --- MAP TOKEN BADGE & HP SYNC (Displaying Full Tactical Stats on Map) ---
        async function syncTokenOnMap(ent) {
            if (!isObrConnected || !OBR_SDK || !ent || !ent.tokenId) return;
            try {
                await OBR_SDK.scene.items.updateItems([ent.tokenId], (items) => {
                    for (let item of items) {
                        if (!item.text) item.text = {};
                        const deadIcon = ent.hp <= 0 ? "💀 " : "";
                        const speed = ent.weaponSpeed !== undefined ? ent.weaponSpeed : 5;
                        const init = ent.initiative !== undefined ? ent.initiative : '-';
                        // Renders exact stats directly on the map token label
                        item.text.plainText = `${deadIcon}${ent.name}\nHP: ${ent.hp}/${ent.maxHp} | TH: ${ent.thac0} | AC: ${ent.ac} | Spd: ${speed} | Init: #${init}`;
                    }
                });
            } catch (e) {
                console.warn("Token map sync warning:", e);
            }
        }

        async function syncAllTokensToMap() {
            if (!isObrConnected || !OBR_SDK) {
                logAction("ℹ️ Map Token Sync is active inside an Owlbear Rodeo room.");
                return;
            }
            let count = 0;
            for (const ent of entities) {
                if (ent.tokenId) {
                    await syncTokenOnMap(ent);
                    count++;
                }
            }
            logAction(`🔗 Synced full tactical stats onto <b>${count}</b> linked Owlbear Rodeo map token(s).`);
        }

        async function bindExistingEntityToMapToken(id) {
            const ent = entities.find(e => e.id === id);
            if (!ent) return;

            if (!isObrConnected || !OBR_SDK) {
                ent.tokenId = "sim_tok_" + Date.now();
                logAction(`🔗 Simulated token linked to <b>${ent.name}</b>.`);
                syncState();
                renderRoster();
                return;
            }

            const selection = await OBR_SDK.player.getSelection();
            if (!selection || selection.length === 0) {
                logAction(`⚠️ Select a token on the Owlbear Rodeo map first, then click <b>🔗 Link Token</b>.`);
                return;
            }
            ent.tokenId = selection[0];
            await syncTokenOnMap(ent);
            logAction(`🔗 Linked <b>${ent.name}</b> to map token and pushed tactical stats!`);
            syncState();
            renderRoster();
        }

        function updateMultiClassFieldVisibility() {
            const class1El = document.getElementById("modalClass1");
            const class2El = document.getElementById("modalClass2");
            const multiRow = document.getElementById("multiClassRow");
            if (!class1El || !class2El || !multiRow) return;

            const class1 = class1El.value;
            const class2 = class2El.value;

            if (class2) {
                multiRow.classList.remove("hidden");
                const lbl1 = document.getElementById("lblLvl1");
                const xp1 = document.getElementById("lblXp1");
                const lbl2 = document.getElementById("lblLvl2");
                const xp2 = document.getElementById("lblXp2");
                if (lbl1) lbl1.innerText = `${class1} Level`;
                if (xp1) xp1.innerText = `${class1} XP`;
                if (lbl2) lbl2.innerText = `${class2} Level`;
                if (xp2) xp2.innerText = `${class2} XP`;
            } else {
                multiRow.classList.add("hidden");
                const lbl1 = document.getElementById("lblLvl1");
                const xp1 = document.getElementById("lblXp1");
                if (lbl1) lbl1.innerText = "Level";
                if (xp1) xp1.innerText = "Experience (XP)";
            }
        }

        function onClassSelectionChange() {
            updateMultiClassFieldVisibility();
            checkExceptionalStrengthVisibility();
            autoCalcAll2eStats(true);
        }

        function autoCalcAll2eStats(recalcHp) {
            const typeEl = document.getElementById("modalType");
            if (!typeEl || typeEl.value === "enemy") return;

            const class1El = document.getElementById("modalClass1");
            const class2El = document.getElementById("modalClass2");
            const lvl1El = document.getElementById("modalLvl1");
            const lvl2El = document.getElementById("modalLvl2");
            const conEl = document.getElementById("modalCon");
            if (!class1El || !lvl1El || !conEl) return;

            const class1 = class1El.value;
            const class2 = class2El ? class2El.value : "";
            const lvl1 = parseInt(lvl1El.value, 10) || 1;
            const lvl2 = lvl2El ? (parseInt(lvl2El.value, 10) || 1) : 1;
            const con = parseInt(conEl.value, 10) || 10;

            let bestThac0 = calcClassThac0(class1, lvl1);
            if (class2) {
                bestThac0 = Math.min(bestThac0, calcClassThac0(class2, lvl2));
            }
            setVal("modalThac0", bestThac0);

            const saves1 = calcClassSaves(class1, lvl1);
            let finalSaves = { ...saves1 };
            if (class2) {
                const saves2 = calcClassSaves(class2, lvl2);
                finalSaves = {
                    ppd: Math.min(saves1.ppd, saves2.ppd),
                    rsw: Math.min(saves1.rsw, saves2.rsw),
                    pp: Math.min(saves1.pp, saves2.pp),
                    bw: Math.min(saves1.bw, saves2.bw),
                    spl: Math.min(saves1.spl, saves2.spl)
                };
            }
            setVal("modalSavePPD", finalSaves.ppd);
            setVal("modalSaveRSW", finalSaves.rsw);
            setVal("modalSavePP", finalSaves.pp);
            setVal("modalSaveBW", finalSaves.bw);
            setVal("modalSaveSPL", finalSaves.spl);

            if (recalcHp) {
                function getHdAvg(c) {
                    const g = get2eArchetype(c);
                    if (g === "warrior") return 6;
                    if (g === "priest") return 5;
                    if (g === "rogue") return 4;
                    return 3;
                }
                const hasWarrior = get2eArchetype(class1) === "warrior" || (class2 && get2eArchetype(class2) === "warrior");
                const conMod = getConHpBonus(con, hasWarrior);

                let calcHp = 0;
                if (class2) {
                    const hp1 = lvl1 * (getHdAvg(class1) + conMod);
                    const hp2 = lvl2 * (getHdAvg(class2) + conMod);
                    calcHp = Math.max(2, Math.round((hp1 + hp2) / 2));
                } else {
                    calcHp = Math.max(lvl1 * 2, Math.round(lvl1 * (getHdAvg(class1) + conMod)));
                }
                setVal("modalMaxHp", calcHp);
                setVal("modalHp", calcHp);
            }
        }

        function loadLocalState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    entities = parsed.entities || defaultEntities;
                    combatXpPool = parsed.combatXpPool || 0;
                    currentRound = parsed.currentRound || 1;
                    activeTurnIndex = parsed.activeTurnIndex || 0;
                } else {
                    entities = defaultEntities;
                }
            } catch (e) {
                entities = defaultEntities;
            }
        }

        async function syncState() {
            const payload = { entities, combatXpPool, currentRound, activeTurnIndex };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {}
            if (isObrConnected && OBR_SDK) {
                try {
                    await OBR_SDK.room.setMetadata({ [META_KEY]: payload });
                } catch (e) {}
            }
        }

        function setGmPermission(isGm) {
            gmMode = isGm;
            const btn = document.getElementById("gmModeBtn");
            const txt = document.getElementById("gmModeText");
            const distBtn = document.getElementById("distributeXpBtn");
            if (gmMode) {
                if (btn) btn.className = "btn-gm-on";
                if (txt) txt.innerText = "GM Mode: ON";
                if (distBtn) distBtn.classList.remove("hidden");
            } else {
                if (btn) btn.className = "btn-gm-off";
                if (txt) txt.innerText = "Player View";
                if (distBtn) distBtn.classList.add("hidden");
            }
            renderRoster();
        }

        function toggleGmMode() {
            if (isObrConnected) {
                logAction("🔒 Inside Owlbear Rodeo, GM permissions follow your room role.");
                return;
            }
            setGmPermission(!gmMode);
        }

        function resetRounds() {
            currentRound = 1;
            activeTurnIndex = 0;
            logAction("🔄 Combat tracker reset to <b>Round 1</b>.");
            syncState();
            renderRoster();
        }

        function clearXpPool() {
            if (!gmMode) return;
            combatXpPool = 0;
            logAction("🧹 Cleared the Combat XP Pool.");
            syncState();
            renderRoster();
        }

        async function linkSelectedMapToken() {
            if (!isObrConnected || !OBR_SDK) {
                openAddModal('enemy', "Simulated Map Token", "sim_tok_" + Date.now());
                return;
            }
            const selection = await OBR_SDK.player.getSelection();
            if (!selection || selection.length === 0) {
                logAction("⚠️ Select a token on the Owlbear Rodeo map first, then click <b>🔗 + From Token</b>.");
                return;
            }
            const items = await OBR_SDK.scene.items.getItems(selection);
            const token = items[0];
            const rawName = (token.text && token.text.plainText) || token.name || "Linked Token";
            const cleanName = rawName.split("\n")[0].replace(/\s*\(\d+\/\d+\)$/, "").replace(/^💀\s*/, "");
            openAddModal('pc', cleanName, token.id);
        }

        function rollAllInitiative() {
            entities.forEach(ent => {
                const baseRoll = Math.floor(Math.random() * 10) + 1;
                const speed = ent.weaponSpeed !== undefined ? ent.weaponSpeed : 5;
                ent.initRoll = baseRoll;
                ent.initiative = baseRoll + speed;
            });
            entities.sort((a, b) => a.initiative - b.initiative);
            activeTurnIndex = 0;
            logAction(`🎲 <b>Round ${currentRound} Initiative Rolled</b>: d10 + Speed applied (Lowest acts first).`);
            syncState();
            renderRoster();
            syncAllTokensToMap();
        }

        async function nextTurn() {
            if (entities.length === 0) return;
            let attempts = 0;
            do {
                activeTurnIndex++;
                if (activeTurnIndex >= entities.length) {
                    activeTurnIndex = 0;
                    currentRound++;
                }
                attempts++;
            } while (entities[activeTurnIndex].hp <= 0 && attempts < entities.length);

            const activeEnt = entities[activeTurnIndex];
            logAction(`⏭️ <b>Round ${currentRound}</b>: Now acting &rarr; <b class="text-amber">${activeEnt.name}</b> (Init #${activeEnt.initiative})`);
            if (isObrConnected && OBR_SDK && activeEnt.tokenId) {
                try { await OBR_SDK.player.select([activeEnt.tokenId]); } catch (e) {}
            }
            syncState();
            renderRoster();
        }

        function updateSpeed(id, val) {
            const ent = entities.find(e => e.id === id);
            if (!ent) return;
            ent.weaponSpeed = parseInt(val, 10) || 0;
            if (ent.initRoll !== undefined) {
                ent.initiative = ent.initRoll + ent.weaponSpeed;
            }
            syncTokenOnMap(ent);
            syncState();
            renderRoster();
        }

        function rollAbilityCheck(id, statName, score) {
            const ent = entities.find(e => e.id === id);
            if (!ent) return;
            const roll = Math.floor(Math.random() * 20) + 1;
            const passed = roll <= score && roll !== 20;
            const badge = passed ? `<span class="text-emerald">SUCCESS!</span>` : `<span class="text-red">FAIL!</span>`;
            logAction(`🎲 <b>${ent.name}</b> ${statName} Check: rolled <b>${roll}</b> (Needs &le; ${score}) &rarr; ${badge}`);
        }

        function rollSavingThrow(id, saveLabel, target) {
            const ent = entities.find(e => e.id === id);
            if (!ent) return;
            const roll = Math.floor(Math.random() * 20) + 1;
            const passed = roll >= target && roll !== 1;
            const badge = passed ? `<span class="text-emerald">SAVED!</span>` : `<span class="text-red">FAILED!</span>`;
            logAction(`🛡️ <b>${ent.name}</b> Save vs. ${saveLabel}: rolled <b>${roll}</b> (Needs &ge; ${target}) &rarr; ${badge}`);
        }

        function rollAttack(id) {
            const ent = entities.find(e => e.id === id);
            if (!ent) return;
            const roll = Math.floor(Math.random() * 20) + 1;
            const toHitMod = ent.toHitMod || 0;
            const adjustedRoll = roll + toHitMod;
            const acHit = ent.thac0 - adjustedRoll;

            let rollDetails = `⚔️ <b>${ent.name}</b> rolls <b>${roll}</b>`;
            if (toHitMod !== 0) rollDetails += ` (${toHitMod >= 0 ? '+' + toHitMod : toHitMod} = <b>${adjustedRoll}</b>)`;
            rollDetails += ` vs THAC0 ${ent.thac0}`;

            if (roll === 20) rollDetails += ` ✨ <span class="text-amber">CRIT!</span>`;
            if (roll === 1) rollDetails += ` 💥 <span class="text-red">MISS!</span>`;
            rollDetails += ` &rarr; Hits <b>AC ${acHit}</b> or worse!`;
            logAction(rollDetails);
        }

        function rollDamage(id) {
            const ent = entities.find(e => e.id === id);
            if (!ent) return;
            const diceStr = ent.weaponDice || "1d6";
            const mod = ent.dmgMod || 0;
            const parts = diceStr.toLowerCase().split('d');
            const numDice = parseInt(parts[0], 10) || 1;
            const dieSides = parseInt(parts[1], 10) || 6;

            let totalRoll = 0;
            let rolls = [];
            for (let i = 0; i < numDice; i++) {
                const r = Math.floor(Math.random() * dieSides) + 1;
                rolls.push(r);
                totalRoll += r;
            }

            const finalDmg = Math.max(1, totalRoll + mod);
            const signMod = mod >= 0 ? `+${mod}` : `${mod}`;
            logAction(`💥 <b>${ent.name}</b> deals <span class="text-red">${finalDmg} damage</span> (${diceStr} [${rolls.join(', ')}] ${signMod}).`);
        }

        function renderRoster() {
            const container = document.getElementById("rosterContainer");
            if (!container) return;
            container.innerHTML = "";
            const roundBadge = document.getElementById("roundBadge");
            if (roundBadge) roundBadge.innerText = `Rd ${currentRound}`;

            const clearBtn = document.getElementById("clearXpBtn");
            if (clearBtn) {
                if (gmMode && combatXpPool > 0) clearBtn.classList.remove("hidden");
                else clearBtn.classList.add("hidden");
            }

            const filterEl = document.getElementById("groupFilter");
            const filterVal = filterEl ? filterEl.value : "all";

            const groups = [
                { key: 'pc', title: '🛡️ Player Characters (PCs)', color: '#fbbf24' },
                { key: 'npc', title: '👤 Non-Player Characters (NPCs)', color: '#60a5fa' },
                { key: 'enemy', title: '👹 Enemies & Monsters', color: '#f87171' }
            ];

            groups.forEach(g => {
                if (filterVal !== 'all' && filterVal !== g.key) return;
                const groupEntities = entities.filter(e => e.type === g.key);
                if (groupEntities.length === 0 && filterVal === 'all') return;

                const groupWrapper = document.createElement("div");

                const header = document.createElement("div");
                header.className = "group-header";
                header.style.color = g.color;
                header.innerHTML = `<span>${g.title} (${groupEntities.length})</span><span class="text-muted">Tactical View</span>`;
                groupWrapper.appendChild(header);

                groupEntities.forEach(ent => {
                    const globalIdx = entities.findIndex(x => x.id === ent.id);
                    const isTurn = globalIdx === activeTurnIndex;
                    const isExpanded = expandedRows[ent.id];
                    const isEnemy = ent.type === "enemy";
                    const isDead = ent.hp <= 0;
                    const hpPercent = Math.max(0, Math.min(100, (ent.hp / ent.maxHp) * 100));

                    const card = document.createElement("div");
                    card.className = `card ${isTurn ? 'card-turn' : ''} ${isEnemy ? 'card-enemy' : ''} ${isDead ? 'card-dead' : ''}`;

                    const showEnemyStats = gmMode || !isEnemy;
                    const displayThac0 = showEnemyStats ? ent.thac0 : "??";
                    const displayAc = showEnemyStats ? ent.ac : "??";
                    const displaySpeed = ent.weaponSpeed !== undefined ? ent.weaponSpeed : 5;
                    const displayInit = ent.initiative !== undefined ? ent.initiative : '-';

                    let enemyHealthDesc = "Healthy";
                    if (hpPercent <= 0) enemyHealthDesc = "Dead 💀";
                    else if (hpPercent < 25) enemyHealthDesc = "Near Death 🔴";
                    else if (hpPercent < 50) enemyHealthDesc = "Wounded 🟡";
                    else if (hpPercent < 75) enemyHealthDesc = "Injured 🟠";

                    const displayHpValue = showEnemyStats ? `${ent.hp} / ${ent.maxHp}` : enemyHealthDesc;

                    let awardBtnText = "🎁 Award XP";
                    const hasWisBonus = (ent.wis || 10) >= 18;
                    if (ent.class2 && hasWisBonus) awardBtnText = "🎁 Award XP (Split + 10% WIS)";
                    else if (ent.class2) awardBtnText = "🎁 Award XP (50/50 Split)";
                    else if (hasWisBonus) awardBtnText = "🎁 Award XP (+10% WIS)";

                    const nextXp1 = !isEnemy ? getNextLevelXp(ent.class1, ent.lvl1) : 0;
                    const nextXp2 = (!isEnemy && ent.class2) ? getNextLevelXp(ent.class2, ent.lvl2 || ent.lvl1) : 0;
                    const readyLvl1 = !isEnemy && (ent.xp1 || 0) >= nextXp1;
                    const readyLvl2 = !isEnemy && ent.class2 && (ent.xp2 || 0) >= nextXp2;

                    const statusBadgesHtml = (ent.statuses || []).map(s => `<span class="status-badge">${s}</span>`).join(" ");

                    card.innerHTML = `
                        <div class="row-between" style="cursor:pointer;" onclick="toggleExpand('${ent.id}')">
                            <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">
                                <div style="font-weight:700; color:#fff; display:flex; align-items:center; gap:4px; font-size:13px;">
                                    ${isDead ? '💀 ' : ''}${ent.name} ${ent.tokenId ? '<span title="Synced to Owlbear Rodeo Map Token">🔗</span>' : ''}
                                    ${statusBadgesHtml}
                                </div>
                                <div class="text-muted">${isEnemy ? `HD: ${ent.hd || '1'}` : `${ent.class1} ${ent.lvl1}${ent.class2 ? ' / ' + ent.class2 + ' ' + (ent.lvl2 || ent.lvl1) : ''}${ent.str === 18 && ent.exceptionalStr ? ' (18/' + ent.exceptionalStr + ')' : ''}`}</div>
                            </div>
                            <div class="row-center">
                                <button onclick="event.stopPropagation(); rollAttack('${ent.id}')" title="Roll 1d20 Attack vs THAC0" class="btn-amber btn-icon">⚔️</button>
                                <button onclick="event.stopPropagation(); rollDamage('${ent.id}')" title="Roll Weapon Damage" class="btn-red btn-icon">💥</button>
                                <button onclick="event.stopPropagation(); openEditModal('${ent.id}')" title="Edit Entity" class="btn-ghost">⚙️</button>
                            </div>
                        </div>

                        <div class="tactical-grid">
                            <div class="tac-badge badge-thac0" title="THAC0">
                                <span class="tac-label">THAC0</span>
                                <span>${displayThac0}</span>
                            </div>
                            <div style="text-align:center;">
                                <span class="init-pill ${isTurn ? 'init-pill-active' : ''}" style="font-size:11px; padding:3px 8px;">
                                    ${isTurn ? '⭐ ACTIVE TURN' : `Init: #${displayInit}`}
                                </span>
                            </div>
                            <div class="tac-badge badge-ac" title="Armor Class">
                                <span class="tac-label">AC</span>
                                <span>${displayAc}</span>
                            </div>
                        </div>

                        <div class="tactical-grid" style="grid-template-columns: 55px 1fr 55px;">
                            <div class="tac-badge badge-spd" title="Weapon Speed / Cast Time">
                                <span class="tac-label">Speed</span>
                                <input type="number" value="${displaySpeed}" onchange="updateSpeed('${ent.id}', this.value)" class="input-spd" style="width:38px; background:transparent; border:none; color:#facc15; font-size:13px; text-align:center;">
                            </div>
                            <div style="text-align:center; font-size:10px; color:#9ca3af;">
                                Tap card header to expand details
                            </div>
                            <div class="tac-badge badge-init" title="Combat Initiative">
                                <span class="tac-label">Init #</span>
                                <span>${displayInit}</span>
                            </div>
                        </div>

                        <div class="hero-hp-bar">
                            <span style="font-size:11px; opacity:0.9;">HP</span>
                            ${showEnemyStats ? `
                                <input type="text" value="${ent.hp}/${ent.maxHp}" onchange="updateHp('${ent.id}', this.value)" title="Type -6 for damage, +4 for heal, or exact HP">
                            ` : `
                                <span style="font-size:13px; font-weight:800;">${displayHpValue}</span>
                            `}
                        </div>

                        <div class="drawer ${isExpanded ? '' : 'hidden'}">
                            ${!isEnemy ? `
                                <div class="grid-6">
                                    <button onclick="rollAbilityCheck('${ent.id}', 'STR', ${ent.str || 10})" class="roll-box"><span class="stat-label">STR</span><span class="text-amber">${ent.str || 10}</span></button>
                                    <button onclick="rollAbilityCheck('${ent.id}', 'DEX', ${ent.dex || 10})" class="roll-box"><span class="stat-label">DEX</span><span class="text-amber">${ent.dex || 10}</span></button>
                                    <button onclick="rollAbilityCheck('${ent.id}', 'CON', ${ent.con || 10})" class="roll-box"><span class="stat-label">CON</span><span class="text-amber">${ent.con || 10}</span></button>
                                    <button onclick="rollAbilityCheck('${ent.id}', 'INT', ${ent.int || 10})" class="roll-box"><span class="stat-label">INT</span><span class="text-amber">${ent.int || 10}</span></button>
                                    <button onclick="rollAbilityCheck('${ent.id}', 'WIS', ${ent.wis || 10})" class="roll-box"><span class="stat-label">WIS</span><span class="text-amber">${ent.wis || 10}</span></button>
                                    <button onclick="rollAbilityCheck('${ent.id}', 'CHA', ${ent.cha || 10})" class="roll-box"><span class="stat-label">CHA</span><span class="text-amber">${ent.cha || 10}</span></button>
                                </div>

                                <div class="grid-5">
                                    <button onclick="rollSavingThrow('${ent.id}', 'Poison/Death', ${ent.saves?.ppd || 14})" class="roll-box"><span class="stat-label">PPD</span><span class="text-emerald">${ent.saves?.ppd || 14}</span></button>
                                    <button onclick="rollSavingThrow('${ent.id}', 'Rod/Staff/Wand', ${ent.saves?.rsw || 16})" class="roll-box"><span class="stat-label">RSW</span><span class="text-emerald">${ent.saves?.rsw || 16}</span></button>
                                    <button onclick="rollSavingThrow('${ent.id}', 'Petrify/Poly', ${ent.saves?.pp || 15})" class="roll-box"><span class="stat-label">PP</span><span class="text-emerald">${ent.saves?.pp || 15}</span></button>
                                    <button onclick="rollSavingThrow('${ent.id}', 'Breath Weapon', ${ent.saves?.bw || 17})" class="roll-box"><span class="stat-label">BW</span><span class="text-emerald">${ent.saves?.bw || 17}</span></button>
                                    <button onclick="rollSavingThrow('${ent.id}', 'Spell', ${ent.saves?.spl || 17})" class="roll-box"><span class="stat-label">SPL</span><span class="text-emerald">${ent.saves?.spl || 17}</span></button>
                                </div>

                                ${ent.type === 'pc' ? `
                                    <div class="bar-box" style="display:flex; flex-direction:column; gap:6px;">
                                        <div class="row-between" style="flex-wrap:wrap;">
                                            <span class="row-center">
                                                ${ent.class1} XP: <b class="text-amber">${ent.xp1 || 0}</b> <span class="text-muted">/ ${nextXp1}</span>
                                                ${readyLvl1 ? `<button onclick="levelUpClass('${ent.id}', 1)" class="btn-emerald">⬆️ Level Up!</button>` : ''}
                                            </span>
                                            ${ent.class2 ? `
                                                <span class="row-center">
                                                    ${ent.class2} XP: <b class="text-amber">${ent.xp2 || 0}</b> <span class="text-muted">/ ${nextXp2}</span>
                                                    ${readyLvl2 ? `<button onclick="levelUpClass('${ent.id}', 2)" class="btn-emerald">⬆️ Level Up!</button>` : ''}
                                                </span>
                                            ` : ''}
                                        </div>
                                        <div class="row-between">
                                            <div class="row-center">
                                                <input type="number" id="awardInput_${ent.id}" placeholder="Award XP..." style="width:90px;">
                                                <button onclick="promptAwardXp('${ent.id}')" class="btn-amber" style="font-size:10px;">${awardBtnText}</button>
                                            </div>
                                            <button onclick="bindExistingEntityToMapToken('${ent.id}')" class="btn-emerald-outline">${ent.tokenId ? '🔗 Re-link' : '🔗 Link Token'}</button>
                                        </div>
                                    </div>
                                ` : `
                                    <div class="row-between">
                                        <span class="text-muted">NPC Token Sync:</span>
                                        <button onclick="bindExistingEntityToMapToken('${ent.id}')" class="btn-emerald-outline">${ent.tokenId ? '🔗 Re-link' : '🔗 Link Token'}</button>
                                    </div>
                                `}
                            ` : `
                                <div class="bar-box" style="display:flex; flex-direction:column; gap:6px;">
                                    <div class="row-between">
                                        <span class="text-muted">Monster XP: <b class="text-amber">${ent.monsterXp || 50} XP</b></span>
                                        <button onclick="rollMorale('${ent.id}')" class="btn-indigo" style="font-size:10px;">🎲 Roll Morale (2d10 vs ${ent.morale || 12})</button>
                                    </div>
                                    <div class="row-between">
                                        <button onclick="bindExistingEntityToMapToken('${ent.id}')" class="btn-emerald-outline" style="font-size:10px;">${ent.tokenId ? '🔗 Linked' : '🔗 Link Token'}</button>
                                        <button onclick="defeatMonster('${ent.id}')" ${ent.defeated ? 'disabled' : ''} class="${ent.defeated ? 'btn-gm-off' : 'btn-red'}" style="font-size:10px;">
                                            ${ent.defeated ? '✅ XP in Pool' : '💀 Defeat (To Pool)'}
                                        </button>
                                    </div>
                                </div>
                            `}
                        </div>
                    `;
                    groupWrapper.appendChild(card);
                });
                container.appendChild(groupWrapper);
            });

            const xpPoolDisplay = document.getElementById("xpPoolDisplay");
            if (xpPoolDisplay) xpPoolDisplay.innerText = combatXpPool + " XP";
        }

        function toggleExpand(id) {
            expandedRows[id] = !expandedRows[id];
            renderRoster();
        }

        function updateHp(id, valStr) {
            const ent = entities.find(e => e.id === id);
            if (!ent) return;

            valStr = valStr.trim();
            if (valStr.startsWith("+") || valStr.startsWith("-")) {
                const delta = parseInt(valStr, 10);
                ent.hp = Math.max(0, Math.min(ent.maxHp, ent.hp + delta));
            } else if (valStr.includes("/")) {
                const parts = valStr.split("/");
                ent.hp = parseInt(parts[0], 10) || ent.hp;
                ent.maxHp = parseInt(parts[1], 10) || ent.maxHp;
            } else {
                const exact = parseInt(valStr, 10);
                if (!isNaN(exact)) ent.hp = Math.max(0, Math.min(ent.maxHp, exact));
            }

            if (ent.type === 'enemy') {
                if (ent.hp === 0 && !ent.defeated) {
                    ent.defeated = true;
                    combatXpPool += (ent.monsterXp || 50);
                    logAction(`💀 <b>${ent.name}</b> defeated! Added <b>${ent.monsterXp || 50} XP</b> to combat pool.`);
                } else if (ent.hp > 0 && ent.defeated) {
                    ent.defeated = false;
                }
            }
            syncTokenOnMap(ent);
            syncState();
            renderRoster();
        }

        function promptAwardXp(id) {
            const ent = entities.find(e => e.id === id);
            if (!ent || ent.type !== 'pc') return;
            const inputEl = document.getElementById(`awardInput_${id}`);
            if (!inputEl) return;
            const inputVal = parseInt(inputEl.value, 10);
            if (isNaN(inputVal) || inputVal <= 0) return;
            applyXpToPc(ent, inputVal);
            inputEl.value = "";
            syncState();
            renderRoster();
        }

        function applyXpToPc(pc, rawXp) {
            let finalXp = rawXp;
            const wis = pc.wis || 10;
            let wisBonusText = "";
            if (wis >= 18) {
                finalXp = Math.floor(rawXp * 1.10);
                wisBonusText = ` (+10% WIS bonus)`;
            }
            if (pc.class2) {
                const halfXp = Math.floor(finalXp / 2);
                pc.xp1 = (pc.xp1 || 0) + halfXp;
                pc.xp2 = (pc.xp2 || 0) + halfXp;
                logAction(`🎁 Awarded <b>${rawXp} XP</b> to <b>${pc.name}</b>${wisBonusText} &rarr; +${halfXp} ${pc.class1} / +${halfXp} ${pc.class2}`);
            } else {
                pc.xp1 = (pc.xp1 || 0) + finalXp;
                logAction(`🎁 Awarded <b>${rawXp} XP</b> to <b>${pc.name}</b>${wisBonusText} &rarr; +${finalXp} ${pc.class1}`);
            }
        }

        function defeatMonster(id) {
            const ent = entities.find(e => e.id === id);
            if (!ent || ent.defeated) return;
            ent.hp = 0;
            ent.defeated = true;
            combatXpPool += (ent.monsterXp || 50);
            logAction(`💀 <b>${ent.name}</b> defeated! Added <b>${ent.monsterXp || 50} XP</b> to combat pool.`);
            syncTokenOnMap(ent);
            syncState();
            renderRoster();
        }

        function distributeXpPool() {
            if (!gmMode) return;
            const pcs = entities.filter(e => e.type === 'pc');
            if (pcs.length === 0 || combatXpPool <= 0) {
                logAction("⚠️ Add at least one PC and defeat an enemy to distribute pool XP.");
                return;
            }
            const totalPool = combatXpPool;
            const sharePerPc = Math.floor(totalPool / pcs.length);
            pcs.forEach(pc => applyXpToPc(pc, sharePerPc));
            logAction(`✨ Distributed <b>${totalPool} XP</b> pool (${sharePerPc} base XP each) among ${pcs.length} PCs!`);
            combatXpPool = 0;
            syncState();
            renderRoster();
        }

        function logAction(msg) {
            const logEl = document.getElementById("actionLogText");
            if (logEl) logEl.innerHTML = msg;
        }

        function openAddModal(type, presetName = "", tokenId = "") {
            setVal("editEntityId", "");
            setVal("modalTokenId", tokenId);
            const titleEl = document.getElementById("modalTitle");
            if (titleEl) titleEl.innerText = type === 'pc' ? "Add Player Character" : type === 'npc' ? "Add NPC" : "Add Enemy / Monster";
            setVal("modalType", type);
            setVal("modalName", presetName || (type === 'pc' ? "New Hero" : type === 'npc' ? "Town Guard" : "Orc Raider"));
            setVal("modalAc", type === 'enemy' ? "6" : "5");
            setVal("modalWeaponDice", type === 'enemy' ? "1d6" : "1d8");
            setVal("modalToHit", "0");
            setVal("modalDmgMod", type === 'enemy' ? "0" : "1");
            setVal("modalWeaponSpeed", "5");
            setVal("modalMonsterXp", "65");
            setVal("modalHd", "2");
            setVal("modalMorale", "12");
            setVal("modalClass1", "Fighter");
            setVal("modalClass2", "");
            setVal("modalLvl1", "1");
            setVal("modalLvl2", "1");
            setVal("modalStr", "15");
            setVal("modalExceptionalStr", "01");
            setVal("modalDex", "14");
            setVal("modalCon", "14");
            setVal("modalInt", "12");
            setVal("modalWis", "12");
            setVal("modalCha", "10");
            setVal("modalXp1", "0");
            setVal("modalXp2", "0");

            document.querySelectorAll(".status-chk").forEach(chk => chk.checked = false);
            const delBtn = document.getElementById("modalDeleteBtn");
            if (delBtn) delBtn.classList.add("hidden");
            toggleEntityFields();
            updateMultiClassFieldVisibility();
            checkExceptionalStrengthVisibility();

            if (type !== 'enemy') {
                autoCalcAll2eStats(true);
            } else {
                setVal("modalHp", "12");
                setVal("modalMaxHp", "12");
                setVal("modalThac0", "18");
            }
            const modal = document.getElementById("entityModal");
            if (modal) modal.classList.remove("hidden");
        }

        function openEditModal(id) {
            const ent = entities.find(e => e.id === id);
            if (!ent) return;
            setVal("editEntityId", ent.id);
            setVal("modalTokenId", ent.tokenId || "");
            const titleEl = document.getElementById("modalTitle");
            if (titleEl) titleEl.innerText = "Edit " + ent.name;
            setVal("modalType", ent.type);
            setVal("modalName", ent.name);
            setVal("modalHp", ent.hp);
            setVal("modalMaxHp", ent.maxHp);
            setVal("modalThac0", ent.thac0);
            setVal("modalAc", ent.ac);
            setVal("modalWeaponDice", ent.weaponDice || "1d8");
            setVal("modalToHit", ent.toHitMod !== undefined ? ent.toHitMod : 0);
            setVal("modalDmgMod", ent.dmgMod !== undefined ? ent.dmgMod : 1);
            setVal("modalWeaponSpeed", ent.weaponSpeed !== undefined ? ent.weaponSpeed : 5);
            
            if (ent.type !== 'enemy') {
                setVal("modalClass1", ent.class1 || "Fighter");
                setVal("modalClass2", ent.class2 || "");
                setVal("modalLvl1", ent.lvl1 || 1);
                setVal("modalLvl2", ent.lvl2 || ent.lvl1 || 1);
                setVal("modalXp1", ent.xp1 || 0);
                setVal("modalXp2", ent.xp2 || 0);
                setVal("modalStr", ent.str || 10);
                setVal("modalExceptionalStr", ent.exceptionalStr || "01");
                setVal("modalDex", ent.dex || 10);
                setVal("modalCon", ent.con || 10);
                setVal("modalInt", ent.int || 10);
                setVal("modalWis", ent.wis || 10);
                setVal("modalCha", ent.cha || 10);
                setVal("modalSavePPD", ent.saves?.ppd ?? 14);
                setVal("modalSaveRSW", ent.saves?.rsw ?? 16);
                setVal("modalSavePP", ent.saves?.pp ?? 15);
                setVal("modalSaveBW", ent.saves?.bw ?? 17);
                setVal("modalSaveSPL", ent.saves?.spl ?? 17);
            } else {
                setVal("modalMonsterXp", ent.monsterXp || 50);
                setVal("modalHd", ent.hd || "2");
                setVal("modalMorale", ent.morale || 12);
            }

            document.querySelectorAll(".status-chk").forEach(chk => {
                chk.checked = (ent.statuses || []).includes(chk.value);
            });

            const delBtn = document.getElementById("modalDeleteBtn");
            if (delBtn) {
                if (gmMode) delBtn.classList.remove("hidden");
                else delBtn.classList.add("hidden");
            }

            toggleEntityFields();
            updateMultiClassFieldVisibility();
            checkExceptionalStrengthVisibility();
            const modal = document.getElementById("entityModal");
            if (modal) modal.classList.remove("hidden");
        }

        function closeAddModal() {
            const modal = document.getElementById("entityModal");
            if (modal) modal.classList.add("hidden");
        }

        function toggleEntityFields() {
            const typeEl = document.getElementById("modalType");
            if (!typeEl) return;
            const type = typeEl.value;
            const autoBtn = document.getElementById("autoCalcBtn");
            const thac0Label = document.getElementById("thac0Label");
            const charFields = document.getElementById("characterFields");
            const enemyFields = document.getElementById("enemyFields");

            if (type === 'enemy') {
                if (charFields) charFields.classList.add("hidden");
                if (enemyFields) enemyFields.classList.remove("hidden");
                if (autoBtn) autoBtn.classList.add("hidden");
                if (thac0Label) thac0Label.innerText = "THAC0 (HD Calc)";
            } else {
                if (charFields) charFields.classList.remove("hidden");
                if (enemyFields) enemyFields.classList.add("hidden");
                if (autoBtn) autoBtn.classList.remove("hidden");
                if (thac0Label) thac0Label.innerText = "THAC0 (Auto)";
            }
        }

        function saveEntity() {
            const editIdEl = document.getElementById("editEntityId");
            const tokenIdEl = document.getElementById("modalTokenId");
            const typeEl = document.getElementById("modalType");
            const nameEl = document.getElementById("modalName");
            const maxHpEl = document.getElementById("modalMaxHp");
            const hpEl = document.getElementById("modalHp");
            const thac0El = document.getElementById("modalThac0");
            const acEl = document.getElementById("modalAc");
            const weaponDiceEl = document.getElementById("modalWeaponDice");
            const toHitEl = document.getElementById("modalToHit");
            const dmgModEl = document.getElementById("modalDmgMod");
            const weaponSpeedEl = document.getElementById("modalWeaponSpeed");

            const id = editIdEl ? editIdEl.value : "";
            const tokenId = tokenIdEl ? tokenIdEl.value : "";
            const type = typeEl ? typeEl.value : "pc";
            const name = nameEl && nameEl.value ? nameEl.value : "Unknown";
            const maxHp = Math.max(1, parseInt(maxHpEl ? maxHpEl.value : "10", 10) || 10);
            const hp = Math.max(0, Math.min(maxHp, parseInt(hpEl ? hpEl.value : maxHp, 10) ?? maxHp));
            const thac0 = parseInt(thac0El ? thac0El.value : "20", 10) || 20;
            const ac = parseInt(acEl ? acEl.value : "10", 10) ?? 10;
            const weaponDice = weaponDiceEl && weaponDiceEl.value ? weaponDiceEl.value.trim() : "1d6";
            const toHitMod = parseInt(toHitEl ? toHitEl.value : "0", 10) || 0;
            const dmgMod = parseInt(dmgModEl ? dmgModEl.value : "0", 10) || 0;
            const weaponSpeed = parseInt(weaponSpeedEl ? weaponSpeedEl.value : "5", 10) || 5;

            const selectedStatuses = [];
            document.querySelectorAll(".status-chk").forEach(chk => {
                if (chk.checked) selectedStatuses.push(chk.value);
            });

            const readSaves = () => ({
                ppd: parseInt(document.getElementById("modalSavePPD")?.value || "14", 10),
                rsw: parseInt(document.getElementById("modalSaveRSW")?.value || "16", 10),
                pp: parseInt(document.getElementById("modalSavePP")?.value || "15", 10),
                bw: parseInt(document.getElementById("modalSaveBW")?.value || "17", 10),
                spl: parseInt(document.getElementById("modalSaveSPL")?.value || "17", 10)
            });

            let targetEnt = null;
            if (id) {
                const ent = entities.find(e => e.id === id);
                if (ent) {
                    Object.assign(ent, { name, type, hp, maxHp, thac0, ac, weaponDice, toHitMod, dmgMod, weaponSpeed, tokenId, statuses: selectedStatuses });
                    if (type !== 'enemy') {
                        ent.class1 = document.getElementById("modalClass1")?.value || "Fighter";
                        ent.class2 = document.getElementById("modalClass2")?.value || "";
                        ent.lvl1 = parseInt(document.getElementById("modalLvl1")?.value || "1", 10);
                        ent.lvl2 = ent.class2 ? (parseInt(document.getElementById("modalLvl2")?.value || "1", 10)) : 1;
                        ent.xp1 = parseInt(document.getElementById("modalXp1")?.value || "0", 10);
                        ent.xp2 = ent.class2 ? (parseInt(document.getElementById("modalXp2")?.value || "0", 10)) : 0;
                        ent.str = parseInt(document.getElementById("modalStr")?.value || "10", 10);
                        ent.exceptionalStr = document.getElementById("modalExceptionalStr")?.value || "01";
                        ent.dex = parseInt(document.getElementById("modalDex")?.value || "10", 10);
                        ent.con = parseInt(document.getElementById("modalCon")?.value || "10", 10);
                        ent.int = parseInt(document.getElementById("modalInt")?.value || "10", 10);
                        ent.wis = parseInt(document.getElementById("modalWis")?.value || "10", 10);
                        ent.cha = parseInt(document.getElementById("modalCha")?.value || "10", 10);
                        ent.saves = readSaves();
                    } else {
                        ent.monsterXp = parseInt(document.getElementById("modalMonsterXp")?.value || "50", 10);
